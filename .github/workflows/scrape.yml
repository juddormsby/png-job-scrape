name: Daily Job Scrape

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger
  push:
    branches: [main]
    paths:
      - 'code/source_archive.py'
      - 'code/scraper.py'
      - 'tests/test_source_archive.py'
      - '.github/workflows/scrape.yml'

# An overlapping scheduled/manual/deployment run must not race its own push.
concurrency:
  group: daily-job-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Allow workflow to commit and push changes
    
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test source preservation
        run: python -m unittest discover -s tests -v
      
      - name: Create output directories
        run: |
          mkdir -p html_output json_output
      
      - name: Run scraper
        id: scrape
        run: |
          cd code
          python scraper.py

      - name: Verify durable source archive
        id: verify
        if: always() && (steps.scrape.outcome == 'success' || steps.scrape.outcome == 'failure')
        run: python code/source_archive.py verify

      - name: Prepare self-contained current-run recovery copy
        if: always() && (steps.scrape.outcome == 'success' || steps.scrape.outcome == 'failure')
        run: |
          python code/source_archive.py export \
            --run-id "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --destination archive_run
      
      - name: Upload results as artifact
        if: always() && (steps.scrape.outcome == 'success' || steps.scrape.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: scrape-results
          path: |
            json_output/
            html_output/
            archive_run/
          retention-days: 30
      
      - name: Publish verified source archive and successful scrape results
        if: always() && steps.verify.outcome == 'success' && (steps.scrape.outcome == 'success' || steps.scrape.outcome == 'failure')
        env:
          SCRAPE_OUTCOME: ${{ steps.scrape.outcome }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add archive/
          if [ "$SCRAPE_OUTCOME" = "success" ]; then
            git add json_output/all_jobs.json json_output/all_jobs.csv json_output/scrape_summary.json
          fi
          if git diff --staged --quiet; then
            echo "No new results or source versions to publish"
          else
            git commit -m "Auto-update: Scrape results and source archive [skip ci]"
            git push origin HEAD:main
          fi

